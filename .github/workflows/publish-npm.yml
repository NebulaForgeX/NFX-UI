# 每次 push 到 main 时：若 package.json 的 version 在 npm 上尚未发布，则 build 并 publish。
# 使用 npm Trusted Publishing（OIDC），不要在 GitHub 存 NPM_TOKEN。
#
# 必须先在 https://www.npmjs.com/package/nfx-ui → Settings → Trusted Publisher 添加：
#   Organization or user: NebulaForgeX
#   Repository:            NFX-UI
#   Workflow filename:     publish-npm.yml   （只要文件名，不要 .github/workflows/）
#   Environment:           留空（本 workflow 没有 environment:）
#   Allowed actions:       勾选 npm publish（2026-09 之后新建的 publisher 默认可能只有 stage）
#
# Publish on each main push when package.json version is not yet on npm.
# OIDC trusted publishing — no NPM_TOKEN secret.

name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src/**"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/publish-npm.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Get version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if version already published
        id: check
        run: |
          if npm view nfx-ui@${{ steps.pkg.outputs.version }} version 2>/dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Install and build
        if: steps.check.outputs.published != 'true'
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        if: steps.check.outputs.published != 'true'
        run: npm publish
